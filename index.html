<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Currency Converter</title>
    <!-- Google Fonts & FontAwesome -->
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="converter-card">
        <header class="card-header">
            <div class="icon-badge">
                <i class="fa-solid fa-coins"></i>
            </div>
            <h2>Currency Converter</h2>
            <p>Real-time FX rates & instant calculation</p>
        </header>

        <form id="converterForm" onsubmit="return false;">
            <div class="input-group">
                <label for="amount">Enter Amount</label>
                <div class="input-wrapper">
                    <span class="currency-symbol">$</span>
                    <input type="number" id="amount" placeholder="0.00" min="0" step="any" value="1" required>
                </div>
            </div>

            <div class="dropdown-group">
                <div class="field">
                    <label for="from">From</label>
                    <div class="select-wrapper">
                        <select id="from">
                            <option value="USD" selected>USD - US Dollar</option>
                            <option value="EUR">EUR - Euro</option>
                            <option value="GBP">GBP - British Pound</option>
                            <option value="INR">INR - Indian Rupee</option>
                            <option value="JPY">JPY - Japanese Yen</option>
                            <option value="AUD">AUD - Australian Dollar</option>
                            <option value="CAD">CAD - Canadian Dollar</option>
                            <option value="CHF">CHF - Swiss Franc</option>
                            <option value="CNY">CNY - Chinese Yuan</option>
                            <option value="SGD">SGD - Singapore Dollar</option>
                            <option value="AED">AED - UAE Dirham</option>
                        </select>
                    </div>
                </div>

                <button type="button" class="swap-btn" id="swapBtn" aria-label="Swap Currencies" title="Swap currencies">
                    <i class="fa-solid fa-arrow-right-arrow-left"></i>
                </button>

                <div class="field">
                    <label for="to">To</label>
                    <div class="select-wrapper">
                        <select id="to">
                            <option value="INR" selected>INR - Indian Rupee</option>
                            <option value="USD">USD - US Dollar</option>
                            <option value="EUR">EUR - Euro</option>
                            <option value="GBP">GBP - British Pound</option>
                            <option value="JPY">JPY - Japanese Yen</option>
                            <option value="AUD">AUD - Australian Dollar</option>
                            <option value="CAD">CAD - Canadian Dollar</option>
                            <option value="CHF">CHF - Swiss Franc</option>
                            <option value="CNY">CNY - Chinese Yuan</option>
                            <option value="SGD">SGD - Singapore Dollar</option>
                            <option value="AED">AED - UAE Dirham</option>
                        </select>
                    </div>
                </div>
            </div>

            <button type="submit" id="convertBtn">
                <span>Convert</span>
                <i class="fa-solid fa-chevron-right"></i>
            </button>
        </form>

        <div class="result-box" id="resultBox">
            <span class="result-label">Converted Amount</span>
            <div class="result-value" id="resultText">1 USD = 93.79 INR</div>
            <span class="rate-info" id="rateInfo">1 USD ≈ 93.79 INR</span>
        </div>
    </main>

    <script src="script.js"></script>
</body>
</html>
